name: 🤖 AI News Daily

on:
  schedule:
    # UTC 23:00 = JST 08:00（毎朝8時）
    - cron: '0 23 * * *'
  # 手動実行ボタン（テスト用）
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 24を強制使用

jobs:
  save-ai-news-to-box:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI News Bot
        run: python ai_news_bot.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}   # 任意
          BOX_ARCHIVE_FOLDER_ID: "370318355595"       # AI News Archive

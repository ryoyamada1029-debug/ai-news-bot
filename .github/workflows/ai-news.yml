name: 🤖 AI News Daily

on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = JST 08:00
  workflow_dispatch:

jobs:
  save-ai-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI News Bot
        run: python ai_news_bot.py
        env:
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          BOX_CLIENT_ID:              ${{ secrets.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET:          ${{ secrets.BOX_CLIENT_SECRET }}
          BOX_ENTERPRISE_ID:          ${{ secrets.BOX_ENTERPRISE_ID }}
          BOX_PUBLIC_KEY_ID:          ${{ secrets.BOX_PUBLIC_KEY_ID }}
          BOX_PRIVATE_KEY:            ${{ secrets.BOX_PRIVATE_KEY }}
          BOX_PRIVATE_KEY_PASSPHRASE: ${{ secrets.BOX_PRIVATE_KEY_PASSPHRASE }}
          BOX_USER_ID:                ${{ secrets.BOX_USER_ID }}
          BOX_ARCHIVE_FOLDER_ID:      ${{ secrets.BOX_ARCHIVE_FOLDER_ID }}
          NEWS_API_KEY:               ${{ secrets.NEWS_API_KEY }}
